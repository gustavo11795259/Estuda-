<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <nav id="sidebar">
        <div id="sidebar-content">
            <div id="user">
                <img src="avatar.jpg" id="user-avatar" alt="Avatar">
                <p id="user-infos">
                    <span class="item-descricao">
                        Gustavo R.
                    </span>
                    <span class="item-descricao">
                        Aluno - 201ºDS
                    </span>
                </p>
            </div>
            <ul id="side-items">
                <li class="side-item">
                    <a href="#">
                        <i class="fa-solid fa-house"></i>
                        Inicio
                    </a>
                </li>
                <li class="side-item">
                    <a href="#">
                        <i class="fa-solid fa-file-lines"></i>
                        Notas
                    </a>
                </li>
                <li class="side-item">
                    <a href="#">
                        <i class="fa-regular fa-calendar"></i>
                        Frequência
                    </a>
                </li>
                <li class="side-item">
                    <a href="#">
                        <i class="fa-solid fa-book-open"></i>
                        Boletim
                    </a>
                </li>
                <li class="side-item">
                    <a href="#">
                        <i class="fa-jelly fa-regular fa-clock"></i>
                        Horários
                    </a>
                </li>
                <li class="side-item">
                    <a href="#">
                        <i class="fa-solid fa-bell"></i>
                        Avisos
                    </a>
                </li>
                <li class="side-item">
                    <a href="#">
                        <i class="fa-solid fa-user"></i>
                        Perfil
                    </a>
                </li>
            </ul>
        </div>
        <div id="sair">
            <button id="sair-button">
                <i class="fa-solid fa-right-from-bracket"></i>
                Sair
            </button>
        </div>
    </nav>
    <main>
        <section class="boas-vindas">
            <div class="text-boavinda">
                <span class="pessoa">Olá, Gustavo R.</span>
                <h1>Bem-vindo de volta</h1>
                <p>Aqui voce pode acompanhar suas notas, atividades e o seu progresso.</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
